<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://grcczqaldljkrahmxugf.supabase.co; form-action 'none'; base-uri 'none'"><title>マイ資産管理｜パスワード再設定</title><style>body{font-family:system-ui,'Yu Gothic',sans-serif;background:#f3f6fa;color:#1e293b;margin:0}header{background:#17365d;color:white;padding:20px}main{max-width:520px;margin:35px auto;padding:24px;background:white;border-radius:12px;box-shadow:0 2px 12px #0001}label{display:block;margin:18px 0 8px;font-weight:bold}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #9daec1;border-radius:6px;font-size:17px}button{margin-top:22px;background:#1e4976;color:white;border:0;border-radius:7px;padding:13px 18px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}#message{line-height:1.7;white-space:pre-wrap}small{color:#52647c}</style></head><body><header><strong>マイ資産管理｜パスワード再設定</strong></header><main><h1>新しいパスワードを設定</h1><p id="message" role="status">再設定リンクを確認しています…</p><form id="form" hidden><label for="password">新しいパスワード（12文字以上）</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="confirm">新しいパスワード（確認用）</label><input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button id="submit" type="submit">パスワードを変更する</button></form><p><small>メールで届いた再設定リンクから開いてください。パスワードはこのページに保存されません。</small></p></main><script>
'use strict';
const PROJECT='https://grcczqaldljkrahmxugf.supabase.co';
const msg=document.getElementById('message');const form=document.getElementById('form');
const hash=new URLSearchParams(location.hash.slice(1));
const token=hash.get('access_token');const type=hash.get('type');
// URL fragment contains short-lived credentials. Remove them from address bar/history immediately.
history.replaceState(null,'',location.pathname);
if(hash.get('error')||hash.get('error_description')){msg.textContent='リンクが使えません。Supabaseからパスワード再設定メールをもう一度送ってください。';}
else if(type==='recovery'&&token){msg.textContent='新しいパスワードを入力してください。';form.hidden=false;}
else{msg.textContent='パスワード再設定用のリンクを確認できませんでした。Supabaseから再設定メールを送り直し、メール内のリンクを開いてください。';}
form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('password').value;const c=document.getElementById('confirm').value;if(p!==c){msg.textContent='確認用パスワードが一致しません。';return}if(p.length<12){msg.textContent='12文字以上のパスワードを設定してください。';return}const btn=document.getElementById('submit');btn.disabled=true;msg.textContent='変更しています…';try{const res=await fetch(PROJECT+'/auth/v1/user',{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!res.ok){let detail='';try{const b=await res.json();detail=b.msg||b.message||b.error_description||''}catch{}throw Error(detail||'HTTP '+res.status)}form.hidden=true;document.getElementById('password').value='';document.getElementById('confirm').value='';msg.textContent='パスワードを変更しました。\nVer.7のログイン画面を開き、新しいパスワードでログインしてください。';}catch(err){msg.textContent='変更できませんでした。リンクの期限切れなどが考えられます。再設定メールを送り直してください。\n'+err.message;}finally{btn.disabled=false}});
</script></body></html>
